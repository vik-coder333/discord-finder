<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Payment — DiscoverDisc</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%235865f2'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='url(%23g)'/%3E%3Ccircle cx='23' cy='32' r='7' fill='white'/%3E%3Ccircle cx='41' cy='32' r='7' fill='white'/%3E%3C/svg%3E" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:"Inter",sans-serif;
    background: radial-gradient(800px 500px at 50% -10%, rgba(124,92,255,0.25), transparent 70%), #0c0d11; color:#e9eaf0; }
  .box { background:#14151b; border:1px solid #262932; border-radius:20px; padding:40px; max-width:420px; text-align:center; box-shadow:0 30px 70px -20px rgba(0,0,0,.6); }
  .emoji { font-size:54px; }
  h1 { font-family:"Space Grotesk"; font-size:24px; margin:14px 0 6px; }
  p { color:#9ea3b2; font-size:14.5px; line-height:1.6; }
  .spin { width:34px;height:34px;border:3px solid #262932;border-top-color:#7c5cff;border-radius:50%;animation:s 1s linear infinite;margin:6px auto;}
  @keyframes s{to{transform:rotate(360deg)}}
  a.btn { display:inline-block; margin-top:22px; background:linear-gradient(135deg,#7c5cff,#5865f2); color:#fff;
    text-decoration:none; font-weight:600; padding:12px 22px; border-radius:12px; }
</style>
</head>
<body>
  <div class="box" id="box">
    <div class="spin"></div>
    <h1>Confirming your payment…</h1>
    <p>One moment while we activate your featured listing.</p>
  </div>
<script>
  const box = document.getElementById("box");
  const sid = new URLSearchParams(location.search).get("session_id");
  function show(emoji, title, msg) {
    box.innerHTML = `<div class="emoji">${emoji}</div><h1>${title}</h1><p>${msg}</p><a class="btn" href="/">Back to DiscoverDisc</a>`;
  }
  (async () => {
    if (!sid) return show("🤔", "Hmm…", "No payment session was found.");
    // Retry a few times so a free-tier cold start doesn't show a false "pending".
    for (let i = 0; i < 4; i++) {
      try {
        const res = await fetch("/api/checkout/confirm?session_id=" + encodeURIComponent(sid));
        const j = await res.json();
        if (res.ok && j.ok) return show("🎉", "You're featured!", "Your server is now pinned to the top of DiscoverDisc. Thanks for the support!");
      } catch {}
      await new Promise((r) => setTimeout(r, 2500));
    }
    show("⌛", "Payment pending", "We couldn't confirm the payment yet. If you were charged, it'll activate within a few minutes — no need to pay again.");
  })();
</script>
</body>
</html>
